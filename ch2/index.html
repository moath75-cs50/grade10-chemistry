<style>
:root{--navy:#18213a;--or:#ef6a3a;--teal:#1f9e8f;--blue:#2c6fd1;--line:#dfe3ea;--soft:#f5f7fa;--muted:#5b6478}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1c2433;background:#eef1f6;line-height:1.45}
header{background:var(--navy);color:#fff;padding:22px 18px 18px}
header .in{max-width:760px;margin:0 auto}
header .sch{font-size:11px;letter-spacing:.14em;font-weight:700;color:#9fb3d9;text-transform:uppercase}
header h1{margin:8px 0 4px;font-size:26px;line-height:1.15}
header p{margin:0;color:#d5dbea;font-size:14px}
header .h{display:inline-block;margin-top:10px;background:var(--or);color:#fff;font-weight:700;font-size:12px;padding:4px 11px;border-radius:14px;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:14px 12px 40px}
.idx{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.idx b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.idx ol{margin:8px 0 0;padding-left:20px;columns:2;column-gap:24px;font-size:14px}
.idx a{color:var(--navy);text-decoration:none}.idx a:hover{color:var(--or)}
@media(max-width:560px){.idx ol{columns:1}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 16px;overflow:hidden;scroll-margin-top:10px;transition:box-shadow .4s}
.card.target{box-shadow:0 0 0 3px var(--or)}
.bar{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:10px 14px}
.bar .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--or);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.bar .t{flex:1;font-weight:700;font-size:16px}
.bar .s{font-size:11px;color:#6fd3c4;font-weight:600}
.stage{padding:10px 10px 4px}
.stage svg{width:100%;height:auto;display:block}
.stage video{width:100%;height:auto;display:block;border-radius:8px;background:#fff;aspect-ratio:16/9}
.status{min-height:24px;text-align:center;font-weight:700;font-size:15px;color:var(--navy);padding:0 10px}
.cap{font-size:14px;color:#3d4659;padding:6px 16px 4px}
.ctl{display:flex;gap:8px;padding:8px 14px 14px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:700;font-size:14px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:20px;padding:6px 14px;cursor:pointer}
button.pp{background:var(--navy);color:#fff}
.sl{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=range]{flex:1;accent-color:var(--or);height:28px}
.key{background:#fff4e8;border-top:1px solid #f4cfa6;padding:10px 16px;font-size:14px}
.key b{color:#c35a12}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 30px}
footer b{color:var(--or)}
</style>

<script>
// ===================================================== helpers
const NS='http://www.w3.org/2000/svg';
const C={navy:'#18213a',or:'#ef6a3a',teal:'#1f9e8f',blue:'#2c6fd1',red:'#d94c4c',cublue:'#3d8fdc',pink:'#ef8db5',coblue:'#2f55c9',brown:'#7a3412',grey:'#8a93a6',white:'#f7f7f7'};
function el(tag,a={},p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function chem(s){ // formula -> svg tspans
  let o='';for(let i=0;i<s.length;i++){const c=s[i];
    if(/\d/.test(c)&&i>0&&/[A-Za-z)]/.test(s[i-1])){let j=i;while(j<s.length&&/\d/.test(s[j]))j++;o+=`<tspan baseline-shift="sub" font-size="68%">${s.slice(i,j)}</tspan>`;i=j-1}
    else o+=c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c}
  return o}
function T(p,x,y,s,o={}){const t=el('text',{x,y,'font-size':(o.size||12)*(o.raw?1:1.18),fill:o.fill||C.navy,'font-weight':o.w||400,'text-anchor':o.anchor||'middle','font-family':'Inter,system-ui,sans-serif'},p);t.innerHTML=chem(s);return t}
function setT(t,s){t.innerHTML=chem(s)}
const lerp=(a,b,k)=>a+(b-a)*k, clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function hex(c){c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function mix(a,b,k){const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',')})`}
function seg(t,a,b){return clamp((t-a)/(b-a))} // progress of t within [a,b]
function defs(svg){const d=el('defs',{},svg);
  for(const [id,col] of [['ah',C.navy],['aho',C.or],['ahb',C.blue],['aht',C.teal]]){const m=el('marker',{id:id+svg.dataset.k,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},d);el('path',{d:'M0,0 L10,5 L0,10 z',fill:col},m)}
  return d}
function arrowLine(p,x1,y1,x2,y2,col=C.navy,mk='ah',w=2){return el('line',{x1,y1,x2,y2,stroke:col,'stroke-width':w,'marker-end':`url(#${mk}${p.ownerSVGElement?p.ownerSVGElement.dataset.k:p.dataset.k})`},p)}
function path(p,d,o={}){return el('path',Object.assign({d,fill:'none',stroke:C.navy,'stroke-width':2},o),p)}
function rect(p,x,y,w,h,o={}){return el('rect',Object.assign({x,y,width:w,height:h},o),p)}
function circ(p,cx,cy,r,o={}){return el('circle',Object.assign({cx,cy,r},o),p)}
function tubeP(p,x,y,w,h){const r=w/2;return path(p,`M${x},${y} L${x},${y+h-r} A${r},${r} 0 0 0 ${x+w},${y+h-r} L${x+w},${y}`,{'stroke-width':1.8})}
function tubeFill(p,x,y,w,h,frac,col){const r=w/2,top=y+h-h*frac;return path(p,`M${x+2},${top} L${x+2},${y+h-r} A${r-2},${r-2} 0 0 0 ${x+w-2},${y+h-r} L${x+w-2},${top} Z`,{fill:col,stroke:'none'})}
function flame(p,cx,y,s=1){const g=el('g',{},p);path(g,`M${cx},${y-30*s} C${cx+14*s},${y-14*s} ${cx+12*s},${y} ${cx},${y} C${cx-12*s},${y} ${cx-14*s},${y-14*s} ${cx},${y-30*s} Z`,{fill:'#f6a23c',stroke:'none'});path(g,`M${cx},${y-18*s} C${cx+7*s},${y-9*s} ${cx+6*s},${y} ${cx},${y} C${cx-6*s},${y} ${cx-7*s},${y-9*s} ${cx},${y-18*s} Z`,{fill:'#3c7be0',stroke:'none'});return g}
function N2(p,x,y){const g=el('g',{transform:`translate(${x},${y})`},p);circ(g,-5,0,7,{fill:C.blue,stroke:'#123','stroke-width':.7});circ(g,5,0,7,{fill:C.blue,stroke:'#123','stroke-width':.7});return g}
function H2(p,x,y){const g=el('g',{transform:`translate(${x},${y})`},p);circ(g,-3.4,0,4.5,{fill:'#fff',stroke:'#123','stroke-width':.8});circ(g,3.4,0,4.5,{fill:'#fff',stroke:'#123','stroke-width':.8});return g}
function NH3(p,x,y){const g=el('g',{transform:`translate(${x},${y})`},p);for(const [a,b] of [[-7,5],[7,5],[0,-7]])circ(g,a,b,4,{fill:'#fff',stroke:'#123','stroke-width':.8});circ(g,0,0,7,{fill:C.blue,stroke:'#123','stroke-width':.7});return g}
function rnd(a,b){return a+Math.random()*(b-a)}

// ===================================================== scenes
const S=[];
function scene(o){S.push(o)}

scene({id:'reversible',n:1,title:'Reversible reactions: two directions',fw:'2.1.1',h:170,
cap:'Particles go forward (top) and come back in the reverse reaction (bottom) — at the same time.',
init(s){rect(s,40,50,170,64,{rx:8,fill:'#fff4e8',stroke:C.or,'stroke-width':1.8});T(s,125,80,'REACTANTS',{size:14,fill:C.or,w:800});
 rect(s,430,50,170,64,{rx:8,fill:'#eaf7f5',stroke:C.teal,'stroke-width':1.8});T(s,515,80,'PRODUCTS',{size:14,fill:C.teal,w:800});
 this.top=path(s,'M215,60 C280,14 360,14 425,60',{stroke:C.or,'stroke-width':2.5,'marker-end':`url(#aho${s.dataset.k})`});
 this.bot=path(s,'M425,104 C360,150 280,150 215,104',{stroke:C.blue,'stroke-width':2.5,'marker-end':`url(#ahb${s.dataset.k})`});
 T(s,320,22,'forward reaction →',{size:12,fill:C.or,w:700});T(s,320,160,'← reverse reaction',{size:12,fill:C.blue,w:700});T(s,320,92,'⇌',{size:32,w:700});
 this.L1=this.top.getTotalLength();this.L2=this.bot.getTotalLength();
 this.d=[];for(let i=0;i<4;i++){this.d.push([circ(s,0,0,7,{fill:C.or}),i/4,this.top,this.L1]);this.d.push([circ(s,0,0,7,{fill:C.blue}),i/4+.125,this.bot,this.L2])}},
frame(t){for(const [c,ph,p,L] of this.d){const k=((t/3.2)+ph)%1;const pt=p.getPointAtLength(k*L);c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);c.setAttribute('opacity',Math.sin(k*Math.PI)*1.2)}}});

scene({id:'ammonium-chloride',n:1,title:'Heating ammonium chloride',fw:'2.1.1',h:250,period:10,
cap:'Hot bottom: the white solid breaks down into two gases. Cool top: the gases join again and the white solid forms again.',
init(s){const x=150;this.fl=flame(s,x+17,236,1);tubeP(s,x,25,34,170);
 this.solid=el('ellipse',{cx:x+17,cy:182,rx:13,ry:8,fill:'#f2f2f2',stroke:'#9aa','stroke-width':.8},s);
 this.ring=rect(s,x+2,44,30,13,{fill:'#f3f3f3',stroke:'#9aa3b1','stroke-dasharray':'2 2',opacity:0});
 this.g=[];for(let i=0;i<10;i++)this.g.push([circ(s,0,0,2.6,{fill:C.grey}),Math.random(),rnd(6,28)]);
 T(s,250,46,'COOL top of the tube',{size:11,fill:C.blue,w:800,anchor:'start'});T(s,250,64,'NH3 + HCl → NH4Cl',{size:13,w:700,anchor:'start'});T(s,250,80,'white solid forms AGAIN',{size:11,fill:'#545d70',anchor:'start'});
 T(s,250,172,'HOT bottom of the tube',{size:11,fill:C.or,w:800,anchor:'start'});T(s,250,190,'NH4Cl → NH3 + HCl',{size:13,w:700,anchor:'start'});T(s,250,206,'white solid breaks down into gases',{size:11,fill:'#545d70',anchor:'start'});
 this.x=x},
frame(t){const k=(t%10)/10;this.solid.setAttribute('rx',13*(1-k*.7));this.solid.setAttribute('ry',8*(1-k*.7));this.ring.setAttribute('opacity',clamp(k*1.3));
 this.fl.setAttribute('transform',`translate(${167},236) scale(1,${1+.08*Math.sin(t*14)}) translate(${-167},-236)`);
 for(const g of this.g){const [c,ph,dx]=g;const q=((t/2.4)+ph)%1;c.setAttribute('cx',this.x+dx+3*Math.sin(t*3+ph*9));c.setAttribute('cy',175-q*120);c.setAttribute('opacity',q>.92?0:1)}}});

function hydrate(id,title,hyd,anh,fh,fa,nh,na){scene({id,n:2,title,fw:'2.1.1',h:220,period:12,
cap:`Heat: ${nh} → ${na} (water is driven off, endothermic). Add water: ${na} → ${nh} again (it gets hot, exothermic).`,
init(s){this.cr=[];const cx=320,y=120;
 path(s,`M${cx-70},${y} Q${cx},${y+40} ${cx+70},${y}`,{fill:'#eef1f5','stroke-width':1.8});
 const pos=[-45,-30,-15,0,15,30,45,-37,-22,-7,8,23,38,-28,-12,4,20];
 pos.forEach((dx,i)=>{const yy=y+2+(i>6?7:0)+(i>12?6:0);this.cr.push(rect(s,cx+dx-6,yy-7,12,10,{rx:2,fill:hyd,stroke:'#335','stroke-width':.5,transform:`rotate(${(i*23)%40-20} ${cx+dx} ${yy})`}))});
 this.fl=flame(s,cx,205,1.1);this.st=[];for(let i=0;i<4;i++)this.st.push(path(s,'',{stroke:'#9fb6cf','stroke-width':2,fill:'none'}));
 this.drop=path(s,`M${cx},30 C${cx+8},42 ${cx+8},50 ${cx},50 C${cx-8},50 ${cx-8},42 ${cx},30 Z`,{fill:'#7cc0f0',stroke:'none'});
 this.heat=[];for(let i=0;i<3;i++)this.heat.push(path(s,'',{stroke:C.or,'stroke-width':2.4,fill:'none'}));
 this.l1=T(s,120,100,fh,{size:15,w:800});this.l2=T(s,120,120,'hydrated',{size:12,fill:'#545d70'});
 this.r1=T(s,520,100,'',{size:15,w:800});this.r2=T(s,520,120,'',{size:12,fill:'#545d70'});
 Object.assign(this,{hyd,anh,fh,fa,nh,na,cx,y})},
frame(t){const q=t%12;let k; // 0-1 hold, 1-4.5 heat, 4.5-6 hold anh, 6-7 drop, 7-9 rehydrate, 9-12 hold
 if(q<1)k=0;else if(q<4.5)k=ease(seg(q,1,4.5));else if(q<7)k=1;else if(q<9)k=1-ease(seg(q,7,9));else k=0;
 const col=mix(this.hyd,this.anh,k);this.cr.forEach(r=>r.setAttribute('fill',col));
 const heating=q>=1&&q<4.6;this.fl.setAttribute('opacity',heating?1:0);
 this.st.forEach((p,i)=>{const yy=this.y-12-((q*30+i*12)%40);const x=this.cx-30+i*20;p.setAttribute('d',`M${x},${yy+20} q6,-6 0,-12 q-6,-6 0,-12`);p.setAttribute('opacity',heating&&q>1.8?.9:0)});
 const dk=seg(q,6,7);this.drop.setAttribute('transform',`translate(0,${dk*60})`);this.drop.setAttribute('opacity',q>=6&&q<7.1?1:0);
 const hot=q>=7&&q<9.5;this.heat.forEach((p,i)=>{const x=this.cx-50+i*50;const yy=this.y-20-((q*25)%15);p.setAttribute('d',`M${x},${yy} q5,-5 0,-10 q-5,-5 0,-10`);p.setAttribute('opacity',hot?1:0)});
 const showA=k>.5;setT(this.l1,showA?this.fa:this.fh);this.l1.setAttribute('fill',showA?(this.anh===C.white?C.grey:this.anh):this.hyd);this.l2.textContent=showA?'anhydrous (no water)':'hydrated (with water)';
 let st='',sc=C.navy;if(q<1){st=`${this.nh} hydrated salt`}else if(q<4.5){st='Heating… water is driven off (endothermic)';sc=C.or}else if(q<6){st=`Now ${this.na}: anhydrous`}else if(q<9){st='Adding water… it gets HOT (exothermic)';sc=C.blue}else st=`${this.nh} again — the reaction went backwards!`;
 this.status.textContent=st;this.status.style.color=sc;
 setT(this.r1,q<1||q>=9?'':'');}
})}
hydrate('copper-sulfate','Copper(II) sulfate: blue ⇌ white',C.cublue,C.white,'CuSO4·5H2O','CuSO4','blue','white');
hydrate('cobalt-chloride','Cobalt(II) chloride: pink ⇌ blue',C.pink,C.coblue,'CoCl2·6H2O','CoCl2','pink','blue');

scene({id:'water-tests',n:2,title:'The two tests for water',fw:'2.1.1',h:180,period:6,
cap:'Water turns anhydrous copper(II) sulfate from white to blue, and cobalt chloride paper from blue to pink.',
init(s){T(s,160,24,'Test 1: anhydrous copper(II) sulfate',{size:12,fill:C.blue,w:800});T(s,480,24,'Test 2: cobalt(II) chloride paper',{size:12,fill:C.blue,w:800});
 path(s,'M100,120 Q160,150 220,120',{fill:'#eef1f5','stroke-width':1.8});this.pow=path(s,'M108,122 Q160,104 212,122 Q160,138 108,122 Z',{fill:C.white,stroke:'#b9bfca'});
 this.paper=rect(s,450,70,60,72,{rx:3,fill:C.coblue});this.spot=circ(s,480,100,0,{fill:C.pink});
 this.d1=path(s,'M160,40 C167,52 167,58 160,58 C153,58 153,52 160,40 Z',{fill:'#7cc0f0',stroke:'none'});this.d2=path(s,'M480,30 C487,42 487,48 480,48 C473,48 473,42 480,30 Z',{fill:'#7cc0f0',stroke:'none'});
 this.a=T(s,160,168,'WHITE',{size:13,w:800,fill:C.grey});this.b=T(s,480,168,'BLUE',{size:13,w:800,fill:C.coblue})},
frame(t){const q=t%6;const dk=seg(q,.5,1.5);this.d1.setAttribute('transform',`translate(0,${dk*62})`);this.d2.setAttribute('transform',`translate(0,${dk*55})`);
 const vis=q<1.55;this.d1.setAttribute('opacity',vis?1:0);this.d2.setAttribute('opacity',vis?1:0);
 const k=ease(seg(q,1.5,3));this.pow.setAttribute('fill',mix(C.white,C.cublue,k));this.spot.setAttribute('r',k*44);
 this.a.textContent=k>.5?'WHITE → BLUE':'WHITE';this.a.setAttribute('fill',k>.5?C.cublue:C.grey);this.b.textContent=k>.5?'BLUE → PINK':'BLUE';this.b.setAttribute('fill',k>.5?'#d55d91':C.coblue);
 this.status.textContent=k>.5?'Colour change = water is present ✓':'Add a drop of the liquid…'},
after(s){const cp=el('clipPath',{id:'pc'+s.dataset.k},s.querySelector('defs'));rect(cp,450,70,60,72,{rx:3});this.spot.setAttribute('clip-path',`url(#pc${s.dataset.k})`)}});

scene({id:'cobalt-practical',n:2,title:'Class practical: cobalt chloride in hot and cold water',fw:'2.1.1',h:250,period:12,
cap:'The forward reaction (pink → blue) is endothermic. Heating shifts it to blue; cooling shifts it back to pink. You can repeat it again and again.',
init(s){const bk=(x,col)=>{rect(s,x+2,110,126,98,{fill:col});path(s,`M${x-6},80 L${x},84 L${x},210 L${x+130},210 L${x+130},80`,{'stroke-width':1.8})};
 bk(50,'#e3f2fd');bk(460,'#ffe7d6');for(const [x,y] of [[70,130],[95,160],[150,135],[130,180],[160,175]])rect(s,x,y,14,12,{rx:2,fill:'#fff',stroke:'#9cc6e8'});
 this.steam=[];for(let i=0;i<3;i++)this.steam.push(path(s,'',{stroke:'#c9a28a','stroke-width':1.6,fill:'none'}));
 T(s,115,232,'ICE-COLD water',{size:12,fill:C.blue,w:800});T(s,525,232,'HOT water',{size:12,fill:C.or,w:800});
 this.tg=el('g',{},s);this.fill=tubeFill(this.tg,0,0,26,120,.55,C.pink);tubeP(this.tg,0,0,26,120)},
frame(t){const q=t%12;let x,y,k;
 // 0-2 in cold, 2-4 move to hot, 4-6.5 in hot (colour change), 6.5-8.5 move to cold, 8.5-11 colour change, hold
 const cold=[102,70],hot=[512,70];const up=-60;
 if(q<2){[x,y]=cold;}else if(q<4){const m=ease(seg(q,2,4));x=lerp(cold[0],hot[0],m);y=cold[1]+up*Math.sin(m*Math.PI)}else if(q<6.5){[x,y]=hot}else if(q<8.5){const m=ease(seg(q,6.5,8.5));x=lerp(hot[0],cold[0],m);y=cold[1]+up*Math.sin(m*Math.PI)}else{[x,y]=cold}
 if(q<4)k=0;else if(q<6.5)k=ease(seg(q,4,5.8));else if(q<8.5)k=1;else k=1-ease(seg(q,8.5,10.3));
 this.fill.setAttribute('fill',mix(C.pink,C.coblue,k));this.tg.setAttribute('transform',`translate(${x},${y})`);
 this.steam.forEach((p,i)=>{const xx=490+i*35,yy=70-((t*20+i*10)%25);p.setAttribute('d',`M${xx},${yy} q6,-8 0,-16 q-6,-8 0,-16`)});
 this.status.textContent=q<2?'Pink in the cold':q<4?'Moving to hot water…':q<6.5?'HOT → endothermic direction → turns BLUE':q<8.5?'Moving back to ice…':'COLD → exothermic direction → PINK again';
 this.status.style.color=q>=4&&q<6.5?C.coblue:q>=8.5?'#d55d91':C.navy}});

scene({id:'open-closed',n:3,title:'Open and closed systems',fw:'2.1.3',h:230,
cap:'Heating calcium carbonate. In the open tube the CO₂ escapes, so it can never come back. In the closed flask nothing escapes, so equilibrium can be reached.',

 frame(t){const v=this.sl.min+(this.sl.max-this.sl.min)*(.5-.5*Math.cos(t*.7));this.slider.value=v;this.set(v)}},o))}

// ===================================================== engine
const cards=document.getElementById('cards'),idx=document.getElementById('index');
let K=0;
const VID=new Set(['reversible','ammonium-chloride','copper-sulfate','cobalt-chloride','water-tests','cobalt-practical','open-closed','equilibrium-graphs','dynamic','escalator','pressure','concentration','catalyst','haber','contact']);
for(const sc of S){
  const card=document.createElement('section');card.className='card';card.id=sc.id;
  const isV=VID.has(sc.id);
  card.innerHTML=`<div class="bar"><span class="n">${sc.n}</span><span class="t">${sc.title}</span><span class="s">${sc.fw}</span></div><div class="stage"></div>${isV?'':'<div class="status"></div>'}<div class="cap">${sc.cap}</div><div class="ctl"><button class="pp">⏸ Pause</button><button class="rp">↺ Replay</button></div>`;
  cards.appendChild(card);
  const li=document.createElement('li');li.innerHTML=`<a href="#${sc.id}">${sc.title}</a>`;idx.appendChild(li);
  const pp=card.querySelector('.pp');sc.playing=true;sc.visible=false;
  if(isV){
    const v=document.createElement('video');v.src=`v/${sc.id}.mp4`;v.poster=`v/${sc.id}.jpg`;v.muted=true;v.loop=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='none';
    card.querySelector('.stage').appendChild(v);sc.video=v;v.style.cursor='zoom-in';v.onclick=()=>{try{if(v.requestFullscreen)v.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}catch(e){}};sc.isVideo=true;
    const sync=()=>{if(sc.visible&&sc.playing)v.play().catch(()=>{});else v.pause()};sc.sync=sync;
    pp.onclick=()=>{sc.playing=!sc.playing;pp.textContent=sc.playing?'⏸ Pause':'▶ Play';sync()};
    card.querySelector('.rp').onclick=()=>{v.currentTime=0;sc.playing=true;pp.textContent='⏸ Pause';sync()};
    new IntersectionObserver(es=>{sc.visible=es[0].isIntersecting;sync()},{threshold:.35}).observe(card);
    continue;
  }
  const svg=el('svg',{viewBox:`0 0 640 ${sc.h}`});svg.dataset.k=++K;defs(svg);card.querySelector('.stage').appendChild(svg);
  sc.status=card.querySelector('.status');
  if(sc.slider){const cfg=sc.slider;const w=document.createElement('label');w.className='sl';w.innerHTML=`${cfg.label}<input type="range" min="${cfg.min}" max="${cfg.max}" step="${cfg.step||1}">`;card.querySelector('.ctl').appendChild(w);
    sc.sl=cfg;sc.slider=w.querySelector('input');}
  sc.init(svg);if(sc.after)sc.after(svg);
  sc.t=0;
  pp.onclick=()=>{sc.playing=!sc.playing;pp.textContent=sc.playing?'⏸ Pause':'▶ Play'};
  card.querySelector('.rp').onclick=()=>{sc.t=0;sc.playing=true;pp.textContent='⏸ Pause'};
  if(sc.slider){sc.slider.addEventListener('input',()=>{sc.playing=false;pp.textContent='▶ Play';sc.set(+sc.slider.value)})}
  sc.frame(0,0);
  new IntersectionObserver(es=>{sc.visible=es[0].isIntersecting},{threshold:.15}).observe(card);
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;for(const sc of S){if(!sc.isVideo&&sc.visible&&sc.playing){sc.t+=dt;sc.frame(sc.t,dt)}}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function mark(){document.querySelectorAll('.card.target').forEach(c=>c.classList.remove('target'));const id=location.hash.slice(1);const c=id&&document.getElementById(id);if(c){c.classList.add('target');S.forEach(s=>{if(s.id===id){s.playing=true;if(s.isVideo){s.video.currentTime=0;s.sync()}else s.t=0}})}}
window.addEventListener('hashchange',mark);mark();
</script>
